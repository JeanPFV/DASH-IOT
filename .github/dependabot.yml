# Mantém as actions fixadas por SHA e as dependências atualizadas automaticamente
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /angulariot
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /sisiot
    schedule:
      interval: weekly
