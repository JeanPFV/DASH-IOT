<div class="tela-auth">
  <div class="cartao">
    <div class="marca">
      <img src="logo.svg" alt="" class="marca-logo">
      <div>
        <h1>IOT</h1>
        <span>Cadastro de usuário</span>
      </div>
    </div>

    <form (ngSubmit)="cadastrarComDigital()" #registroForm="ngForm">
      <div class="campo">
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" required [(ngModel)]="nome">
      </div>
      <div class="campo">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="email@dominio.com" required [(ngModel)]="email">
      </div>
      <div class="campos-lado">
        <div class="campo">
          <label for="senha">Senha</label>
          <input type="password" id="senha" name="senha" placeholder="••••••••" required [(ngModel)]="senha">
        </div>
        <div class="campo">
          <label for="senha-confirmar">Confirme</label>
          <input type="password" id="senha-confirmar" name="senhaConfirmar" placeholder="••••••••" required [(ngModel)]="senhaConfirmar">
        </div>
      </div>

      <button type="submit" class="botao-digital" [disabled]="aguardandoDigital">
        <img src="digital.png" alt="" class="botao-digital-icone">
        {{ aguardandoDigital ? 'Aguardando o sensor...' : 'Cadastrar com digital' }}
      </button>
      <p class="dica">Depois de clicar, coloque o dedo no sensor, tire e coloque o mesmo dedo de novo.</p>

      <button type="button" class="botao-secundario" (click)="cadastrarSomenteSenha()" [disabled]="aguardandoDigital">
        Cadastrar só com senha
      </button>
    </form>

    <p class="rodape">Já tem cadastro? <a routerLink="/login">Entrar</a></p>
  </div>
</div>
