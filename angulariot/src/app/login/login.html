<div class="tela-auth">
  <div class="cartao">
    <div class="marca">
      <img src="logo.svg" alt="" class="marca-logo">
      <div>
        <h1>IOT</h1>
        <span>Controle de acesso por digital</span>
      </div>
    </div>

    <button type="button" class="botao-digital" (click)="loginDigital()" [disabled]="aguardandoDigital">
      <img src="digital.png" alt="" class="botao-digital-icone">
      {{ aguardandoDigital ? 'Aguardando o sensor...' : 'Entrar com digital' }}
    </button>

    <div class="divisor"><span>ou com e-mail e senha</span></div>

    <form (ngSubmit)="login()" #loginForm="ngForm">
      <div class="campo">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="email@dominio.com" required [(ngModel)]="email">
      </div>
      <div class="campo">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" placeholder="••••••••" required [(ngModel)]="senha">
      </div>
      <button type="submit" class="botao-secundario">Entrar</button>
    </form>

    <p class="rodape">Ainda não tem cadastro? <a routerLink="/registro">Cadastrar digital</a></p>
  </div>
</div>
